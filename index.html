<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08121a"><title>火灾来临 · 沉浸式逃生体验</title>
<style>
:root{--ivory:#f5f2ed;--gold:#eeb98d;--red:#e07c65;--bg:#070e15;--depth:1020px}
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0;background:var(--bg);color:var(--ivory);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
button{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #f6c693;outline-offset:4px}
#app{position:fixed;inset:0;isolation:isolate;overflow:hidden;background:#090f16}
#view{position:absolute;inset:0;overflow:hidden;perspective:var(--depth);perspective-origin:50% 49%;cursor:grab;touch-action:none}
#view.dragging{cursor:grabbing}
#world{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;pointer-events:none}
.layer{position:absolute;inset:-12%;background-size:cover;background-position:center center;backface-visibility:hidden;will-change:transform;pointer-events:none}
#back{transform:translateZ(-340px) scale(1.33333);filter:brightness(.79) saturate(.8) contrast(1.06)}
#middle{transform:translateZ(-105px) scale(1.103);filter:brightness(.88) contrast(1.1);mask-image:radial-gradient(ellipse 65% 63% at 51% 52%,#000 18%,rgba(0,0,0,.74) 46%,transparent 82%)}
#front{transform:translateZ(175px) scale(.8284);filter:contrast(1.1) brightness(.92);mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.95) 11%,rgba(0,0,0,.15) 30%,transparent 41%,transparent 62%,rgba(0,0,0,.2) 73%,#000 100%)}
#near{position:absolute;inset:-22%;transform:translateZ(260px) scale(.745);background:linear-gradient(90deg,rgba(2,6,10,.75),transparent 15%,transparent 86%,rgba(2,6,10,.62));filter:blur(8px);pointer-events:none}
#floor{position:absolute;left:-15%;right:-15%;height:52%;bottom:-27%;transform:translateZ(145px) rotateX(15deg) scale(.86);background:linear-gradient(0deg,rgba(1,5,8,.7),transparent 73%);pointer-events:none}
#fogBack{position:absolute;inset:-30%;transform:translateZ(-60px) scale(1.08);background:radial-gradient(ellipse at 31% 63%,rgba(179,190,196,.19),transparent 38%),radial-gradient(ellipse at 68% 27%,rgba(204,213,216,.18),transparent 45%),radial-gradient(ellipse at 58% 80%,rgba(162,175,181,.12),transparent 42%);filter:blur(35px);mix-blend-mode:screen;opacity:.44;animation:fogA 12s ease-in-out infinite alternate;pointer-events:none}
#fogFront{position:absolute;inset:-32%;transform:translateZ(200px) scale(.82);background:radial-gradient(ellipse at 36% 70%,rgba(187,204,210,.17),transparent 34%),radial-gradient(ellipse at 68% 37%,rgba(173,192,202,.13),transparent 34%);filter:blur(62px);opacity:.28;animation:fogB 14s ease-in-out infinite alternate;pointer-events:none}
#firelight{position:absolute;inset:-18%;transform:translateZ(75px) scale(.92);background:radial-gradient(ellipse at 55% 58%,rgba(255,98,33,.18),transparent 48%);mix-blend-mode:screen;animation:glow 2.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes fogA{0%{translate:-2% 1%;opacity:.35}100%{translate:2% -2%;opacity:.57}}
@keyframes fogB{0%{translate:2% 1%;opacity:.2}100%{translate:-3% -2%;opacity:.45}}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
#spots{position:absolute;inset:0;transform:translateZ(130px) scale(.8725);pointer-events:none}
.hot{position:absolute;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(12,23,30,.42);border:1px solid rgba(255,231,206,.92);color:#fff0de;box-shadow:0 0 0 11px rgba(235,157,105,.12),0 0 23px rgba(235,146,96,.25);font-size:27px;font-weight:300;pointer-events:auto;transform:translate(-50%,-50%);transition:background .2s,scale .2s;animation:hot 2.8s infinite}
.hot:hover{background:rgba(168,90,62,.68);scale:1.18}
@keyframes hot{0%,100%{box-shadow:0 0 0 8px rgba(235,157,105,.1),0 0 20px rgba(235,146,96,.22)}50%{box-shadow:0 0 0 14px rgba(235,157,105,.08),0 0 36px rgba(235,146,96,.38)}}
#shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(3,8,12,.46),transparent 29%,transparent 56%,rgba(3,8,12,.8) 100%),linear-gradient(90deg,rgba(4,9,13,.37),transparent 30%,transparent 72%,rgba(3,7,12,.3))}
#embers{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.ember{position:absolute;width:2px;height:5px;border-radius:50%;background:#f1a46d;box-shadow:0 0 9px rgba(246,141,78,.52);opacity:0;animation:ember var(--d,6s) linear infinite;animation-delay:var(--delay,0s)}
@keyframes ember{0%{transform:translateY(70px);opacity:0}15%{opacity:.55}80%{opacity:.17}100%{transform:translate(var(--x,20px),-130px);opacity:0}}
#fade{position:absolute;inset:0;z-index:25;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(20,30,39,.8),#070d12 76%);opacity:0;transition:opacity .42s ease}
#fade.active{opacity:1}
#header{position:absolute;top:clamp(19px,3.5vw,48px);left:clamp(20px,4vw,76px);right:clamp(20px,4vw,76px);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:18px;pointer-events:none}
#header strong{font-family:"Songti SC","SimSun",serif;font-size:clamp(24px,2.55vw,42px);font-weight:600;letter-spacing:.06em;text-shadow:0 3px 18px #000c}
#nav{display:flex;gap:11px;pointer-events:auto;align-items:center}
.nav-dot{width:42px;height:4px;padding:0;border:0;border-radius:10px;background:rgba(244,239,231,.38);transition:width .38s,background .38s;}
.nav-dot.sel{background:#efb98b;width:67px;box-shadow:0 0 17px #efb98b5a}
#tools{position:absolute;z-index:12;right:clamp(21px,4vw,76px);top:clamp(76px,8.1vw,130px);display:flex;gap:10px}
.tool{width:43px;height:43px;display:grid;place-items:center;color:#eee5db;background:rgba(8,18,26,.4);border:1px solid rgba(240,231,224,.28);backdrop-filter:blur(7px);border-radius:50%;font-size:20px}
.tool:hover{background:rgba(231,171,112,.22)}
#bottom{position:absolute;bottom:clamp(30px,6vh,72px);left:clamp(20px,5vw,96px);right:clamp(20px,5vw,96px);z-index:14;display:flex;align-items:end;justify-content:space-between;gap:32px;pointer-events:none}
#question{pointer-events:none;max-width:48vw;font-family:"Songti SC","SimSun",serif;font-size:clamp(30px,3.6vw,58px);line-height:1.22;font-weight:650;text-shadow:0 4px 25px #000,0 1px 4px #000;margin:0 0 8px}
#options{width:min(460px,37vw);pointer-events:auto;display:flex;flex-direction:column;gap:12px}
.option{border:1px solid rgba(246,229,208,.45);border-radius:10px;min-height:59px;padding:13px 19px;display:flex;gap:15px;align-items:center;background:rgba(7,17,25,.62);color:#fff0e5;font-size:clamp(15px,1.3vw,20px);backdrop-filter:blur(9px);text-align:left;transition:transform .22s,background .22s,border-color .22s}
.option:hover{transform:translateX(-9px);background:rgba(39,49,58,.9);border-color:#f3c594}
.option .mark{width:16px;height:16px;flex:none;border:1.5px solid #f0c99f;border-radius:50%;position:relative}
.option:hover .mark:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#f4c99f}
.option.good{background:rgba(24,83,64,.86);border-color:#b6d8c6}.option.bad{background:rgba(120,50,40,.82);border-color:#ec9b85}
#pop{position:absolute;z-index:18;top:22%;left:54%;max-width:min(380px,56vw);padding:16px 20px;border:1px solid rgba(248,210,173,.55);border-radius:12px;background:rgba(8,17,24,.82);color:#fff1e0;backdrop-filter:blur(16px);font-size:clamp(16px,1.35vw,19px);line-height:1.5;box-shadow:0 20px 60px rgba(0,0,0,.55);opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .28s,transform .28s}
#pop.on{opacity:1;transform:translateY(0)}
#response{position:absolute;z-index:21;left:50%;top:46%;transform:translate(-50%,10px);max-width:min(650px,88vw);min-width:min(400px,80vw);padding:19px 29px;border-radius:13px;border:1px solid rgba(250,213,182,.6);backdrop-filter:blur(16px);background:rgba(7,18,25,.87);text-align:center;font-size:clamp(19px,1.7vw,26px);font-weight:650;text-shadow:0 2px 15px #0007;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#response.on{opacity:1;transform:translate(-50%,0)}
#intro,#end{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:linear-gradient(90deg,rgba(2,8,13,.75),rgba(4,11,16,.48) 58%,rgba(2,8,13,.68));backdrop-filter:blur(7px);transition:opacity .62s ease}
#intro.hide,#end.hide{opacity:0;pointer-events:none}
.intro-inner{text-align:left;width:min(760px,82vw)}
.intro-inner h2{font-family:"Songti SC","SimSun",serif;font-size:clamp(40px,5.3vw,82px);font-weight:650;line-height:1.17;margin:0 0 34px;text-shadow:0 5px 30px #000}
#begin,#replay{border:1px solid #f0c296;background:rgba(231,164,105,.24);color:#fff4e4;border-radius:8px;padding:16px 40px;font-size:20px;backdrop-filter:blur(8px)}
#begin:hover,#replay:hover{background:rgba(228,161,106,.38)}
#end .intro-inner{text-align:center}
#footer{position:absolute;z-index:12;bottom:12px;left:clamp(20px,5vw,96px);font-size:11px;color:rgba(230,228,226,.6);letter-spacing:.03em}
#hint{position:absolute;z-index:10;bottom:12px;right:clamp(20px,5vw,96px);font-size:11px;color:rgba(230,228,226,.65)}
@media(max-width:880px){#header{top:17px;display:block}#header strong{font-size:27px}#nav{margin-top:15px}.nav-dot{width:30px}.nav-dot.sel{width:46px}#tools{top:24px}#bottom{display:block;bottom:36px}#question{max-width:100%;font-size:30px;margin-bottom:14px}#options{width:100%;gap:8px}.option{min-height:46px;font-size:15px;padding:9px 14px}#footer,#hint{display:none}#pop{top:27%;left:12%;max-width:76vw}}
@media(prefers-reduced-motion:reduce){#fogBack,#fogFront,#firelight,.ember,.hot{animation:none!important}}

/* 圆圈“＋”的消防知识弹窗：只在触发后显示；保留完整提示 */
#pop{width:min(430px,39vw);max-width:calc(100vw - 32px);padding:19px 22px 20px;
  background:linear-gradient(135deg,rgba(10,19,28,.96),rgba(22,31,39,.92));
  border:1px solid rgba(239,194,151,.62);border-left:3px solid #efbd8e;
  border-radius:15px;box-shadow:0 23px 65px rgba(0,0,0,.65),0 0 28px rgba(249,158,92,.12);
  pointer-events:none;}
#pop.on{pointer-events:auto}
#pop-head{font-size:19px;line-height:1.45;font-weight:650;letter-spacing:.07em;color:#ffe1b8;
  padding:0 28px 10px 0;border-bottom:1px solid rgba(246,214,183,.22)}
#pop-body{font-size:15px;line-height:1.8;color:#eef0eb;padding-top:10px;font-weight:400}
#pop-close{position:absolute;right:10px;top:9px;width:30px;height:30px;border:0;border-radius:50%;
  background:rgba(255,255,255,.07);color:#f7e3c9;font-size:23px;line-height:25px;cursor:pointer}
#pop-close:hover{background:rgba(243,181,129,.24)}
.hot.on{background:rgba(171,94,63,.72);border-color:#ffe2bc;box-shadow:0 0 0 12px rgba(239,180,126,.17),0 0 35px rgba(246,163,105,.5)}
@media(max-width:880px){#pop{width:min(410px,84vw);max-width:84vw;left:8%!important;top:20%!important;padding:16px 18px}
  #pop-head{font-size:17px}#pop-body{font-size:14px}}

/* 透视加强：后景、主体、近景、空气颗粒在不同Z轴位置 */
:root{--depth:820px}
#view{perspective:820px;perspective-origin:50% 48%}
#world{transform-origin:50% 49%;}
.layer{inset:-18%;background-size:cover;transform-origin:50% 52%;}
#back{transform:translate3d(0,0,-450px) scale(1.53);filter:brightness(.79) saturate(.78) contrast(1.12)}
#middle{opacity:.095;transform:translate3d(0,0,-165px) scale(1.22);filter:brightness(.92) contrast(1.1);mask-image:radial-gradient(ellipse 64% 60% at 52% 51%,#000 25%,rgba(0,0,0,.89) 51%,transparent 89%)}
#front{transform:translate3d(0,0,265px) scale(.70);opacity:.20;filter:blur(9px) contrast(1.07) brightness(.67);mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.48) 5%,transparent 17%,transparent 83%,rgba(0,0,0,.48) 95%,#000 100%)}
#near{transform:translateZ(365px) scale(.64);filter:blur(7px);background:linear-gradient(90deg,rgba(1,4,7,.82),transparent 13%,transparent 88%,rgba(1,5,9,.78))}
#floor{transform:translateZ(205px) rotateX(24deg) scale(.75);height:50%;bottom:-26%}
#fogBack{transform:translateZ(-80px) scale(1.17);opacity:.55;filter:blur(31px)}
#fogFront{transform:translateZ(330px) scale(.76);opacity:.36;filter:blur(54px)}
#spots{transform:translateZ(155px) scale(.844);}
#firelight{transform:translateZ(95px) scale(.9);background:radial-gradient(ellipse at 59% 57%,rgba(255,113,49,.2),transparent 48%)}
#lightFollow{position:absolute;inset:-20%;transform:translateZ(290px) scale(.75);pointer-events:none;opacity:.33;mix-blend-mode:screen;
 background:radial-gradient(ellipse 23% 29% at var(--light-x,53%) var(--light-y,48%),rgba(218,233,242,.20),rgba(188,208,221,.035) 60%,transparent 82%);
 filter:blur(28px);transition:opacity .4s ease;}
#airParticles{position:absolute;inset:-14%;transform:translateZ(355px) scale(.66);pointer-events:none;opacity:.48;
 background-image:radial-gradient(circle,rgba(245,224,200,.28) .7px,transparent 1.3px),radial-gradient(circle,rgba(204,216,223,.22) .6px,transparent 1.2px);
 background-size:97px 107px,151px 139px;animation:airDrift 18s linear infinite alternate;}
@keyframes airDrift{from{background-position:0 0,33px 22px;opacity:.20}to{background-position:39px -66px,-42px -34px;opacity:.45}}
#view::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 115px 30px rgba(0,0,0,.33);z-index:2;}
/* 极简：仅保留热点、提问、选择按钮及很小的操作提示 */
#header strong{font-size:clamp(23px,2.1vw,34px)}
#bottom{bottom:clamp(38px,6vh,72px)}
#question{font-size:clamp(27px,3.15vw,49px);max-width:52vw}
.option{min-height:55px;font-size:clamp(15px,1.25vw,19px);padding:12px 17px}
#intro .intro-inner h2,#end .intro-inner h2{font-size:clamp(40px,4.9vw,77px)}
@media (max-width:880px){#question{max-width:100%;font-size:29px}}
@media (prefers-reduced-motion: reduce){#airParticles{animation:none!important}}


/* 光照会随着视角变化，前景遮挡更强，鼠标转动时产生真实空间纵深 */
#back {will-change:transform,filter}
#middle {will-change:transform,opacity}
#front {will-change:transform,opacity}
#view {perspective:770px}
#lightFollow {opacity:.42;filter:blur(24px)}
#airParticles {opacity:.4;background-size:83px 97px,141px 125px}
#fogBack {animation-duration:10s}
#fogFront {animation-duration:13s}
#spots .hot {backdrop-filter:blur(3px);transition:scale .26s ease,background .26s ease,box-shadow .26s ease}
#spots .hot:hover{scale:1.25;box-shadow:0 0 0 15px rgba(235,157,105,.08),0 0 52px rgba(245,168,104,.48)}
@media(min-width:1200px){#bottom {bottom:clamp(45px,7vh,88px)}}

/* 点击层与3D图片层解耦：鼠标拖动镜头时不抢走“＋”的点击事件。 */
#spots { position:absolute !important; inset:0 !important; transform:none !important; z-index:13 !important; pointer-events:none !important; }
#spots .hot { pointer-events:auto !important; }
/* 修复：点按“＋”后解释文字显示在最高层，避免被3D场景和光影遮挡。 */
#pop {
  z-index: 90 !important;
  width: min(450px, 39vw);
  max-width: calc(100vw - 34px);
  min-width: 280px;
  box-sizing: border-box;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  isolation: isolate;
  transform: translate3d(0, 14px, 0);
  transition: none !important;
}
#pop.on {
  opacity: 1 !important;
  visibility: visible !important;
  transition: none !important;
  pointer-events: auto !important;
  transform: translate3d(0, 0, 0) !important;
}
#pop-head { display: block; opacity: 1 !important; }
#pop-body { display: block; opacity: 1 !important; white-space: normal; overflow-wrap: anywhere; }
#spots .hot { z-index: 3; pointer-events: auto !important; }
#pop-close { z-index: 3; }
@media (max-width: 880px) {
  #pop { width: min(450px, 84vw); min-width: 0; left: 8% !important; top: 20% !important; }
}
</style></head><body>
<div id="app">
  <div id="view"><div id="world">
    <div class="layer" id="back"></div><div class="layer" id="middle"></div><div class="layer" id="front"></div>
    <div id="fogBack"></div><div id="firelight"></div><div id="floor"></div><div id="near"></div><div id="fogFront"></div>
   <div id="lightFollow"></div>
   <div id="airParticles"></div><div id="spots"></div>
  </div></div>
  <div id="embers"></div><div id="shade"></div><div id="fade"></div>
  <div id="header"><strong>火灾来临</strong><div id="nav"></div></div>
  <div id="tools"><button class="tool" id="reset" aria-label="视角复位" title="视角复位">↺</button><button class="tool" id="full" aria-label="全屏" title="全屏">⛶</button></div>
  <div id="pop" role="dialog" aria-modal="false" aria-label="消防安全提示" aria-live="polite"><button type="button" id="pop-close" aria-label="关闭提示">×</button><div id="pop-head"></div><div id="pop-body"></div></div>
  <div id="bottom"><h2 id="question"></h2><div id="options"></div></div>
  <div id="response" role="status"></div>
  <div id="footer">模拟画面，非真实事故现场</div><div id="hint">拖动视角 · 点击光点</div>
  <div id="intro"><div class="intro-inner"><h2>身在火场，<br>你会怎么做？</h2><button id="begin">进入现场 ↗</button></div></div>
  <div id="end" class="hide"><div class="intro-inner"><h2>判断正确，<br>才能争取时间。</h2><button id="replay">重新体验 ↻</button></div></div>
</div>

 [35,50,'楼道方向','楼道浓烟弥漫时，不要冒险再次进入。如果不能安全撤离，应选择相对安全的位置等待救援。'],
 [77,73,'报警与求救','立即拨打119，说清具体地址、楼层、房间位置和被困人数，并在安全位置向外示意，等待专业救援。']
],choices:[['跳窗逃生',false,'不要盲目跳楼。'],['堵门缝并报警',true,'及时报警，在安全位置待援。']]},
{question:'已经出来，接下来呢？',points:[
 [77,53,'消防通道','远离消防车和救援通道，不要围观堵路，给消防人员和救援车辆留出空间。'],
 [64,63,'消防救援人员','清点已撤离的人员，并尽快告诉消防员可能仍在楼内的人员、所在位置和现场危险情况。'],
 [27,65,'室外安全区域','撤离后不要返回火场取物。如果出现吸入浓烟、呼吸困难或其他不适，应尽快寻求医疗帮助。']
],choices:[['返回取东西',false,'不要为财物重返火场。'],['清点人数并告知消防',true,'提供信息，协助救援。']]}
];
const $=id=>document.getElementById(id);
const view=$('view'),world=$('world'),back=$('back'),mid=$('middle'),front=$('front'),spots=$('spots'),nav=$('nav'),choices=$('options'),fade=$('fade'),response=$('response'),pop=$('pop');
const activePoints=[];
let current=0,started=false,ended=false,busy=false,down=null,hoverX=0,hoverY=0,dragX=0,dragY=0,targetZoom=0,rx=0,ry=0,rz=0,tx=0,ty=0,mode='auto',popT=null,respT=null,transitionT=[];
for(let i=0;i<scenes.length;i++){const b=document.createElement('button');b.className='nav-dot';b.title='场景切换';b.setAttribute('aria-label','查看已解锁场景');b.onclick=()=>{if(started&&!busy&&!ended&&i<=current)setScene(i)};nav.append(b)}
for(let i=0;i<16;i++){const p=document.createElement('span');p.className='ember';p.style.left=(12+Math.random()*78)+'%';p.style.top=(32+Math.random()*62)+'%';p.style.setProperty('--d',(5+Math.random()*6)+'s');p.style.setProperty('--delay',(-Math.random()*8)+'s');p.style.setProperty('--x',(-25+Math.random()*50)+'px');$('embers').append(p)}
function setImages(i){for(const n of [back,mid,front])n.style.backgroundImage=`url("${images[i]}")`;}
function cameraLoop(){
 const desiredY=(mode==='drag'?dragX:hoverX), desiredX=(mode==='drag'?dragY:hoverY);
 ry+=(desiredY-ry)*.065;rx+=(desiredX-rx)*.065;rz+=(targetZoom-rz)*.06;
 // 摄影机推进 + 微幅横移：强化近景与远景的不同运动速度。
 const px=(-ry*1.66),py=(rx*1.07);
 world.style.transform=`translate3d(${px.toFixed(2)}px,${py.toFixed(2)}px,${rz.toFixed(1)}px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
 back.style.transform=`translate3d(${(ry*.66).toFixed(1)}px,${(-rx*.36).toFixed(1)}px,-450px) scale(1.53)`;
 mid.style.transform=`translate3d(${(-ry*.72).toFixed(1)}px,${(rx*.4).toFixed(1)}px,-165px) scale(1.22)`;
 front.style.transform=`translate3d(${(-ry*1.85).toFixed(1)}px,${(rx*1.1).toFixed(1)}px,265px) scale(.70)`;
 $('lightFollow').style.setProperty('--light-x',(53+ry*.42).toFixed(1)+'%');
 $('lightFollow').style.setProperty('--light-y',(48-rx*.66).toFixed(1)+'%');
 requestAnimationFrame(cameraLoop)
}
requestAnimationFrame(cameraLoop);
function resetView(){hoverX=hoverY=dragX=dragY=0;targetZoom=0;mode='auto'}
function hidePop(){pop.classList.remove('on');spots.querySelectorAll('.hot').forEach(x=>x.classList.remove('on'));clearTimeout(popT)}
$('pop-close').addEventListener('click',e=>{e.stopPropagation();hidePop()});
function setScene(i){current=i;busy=false;resetView();hidePop();setImages(i);$('question').textContent=scenes[i].question;
 [...nav.children].forEach((b,j)=>b.classList.toggle('sel',j===i));
 spots.replaceChildren();scenes[i].points.forEach(([x,y,label,detail])=>{let b=document.createElement('button');b.className='hot';b.type='button';b.textContent='+';b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label','查看'+label+'的消防安全提示');b.onclick=e=>{e.stopPropagation();
   const wasOpen=pop.classList.contains('on')&&b.classList.contains('on');
   hidePop();if(wasOpen)return;
   $('pop-head').textContent=label;$('pop-body').textContent=detail;
   pop.style.left=(x>60?Math.max(13,x-40):Math.min(57,x+5))+'%';
   pop.style.top=(y>57?y-27:Math.min(70,y+6))+'%';
   pop.classList.add('on');b.classList.add('on');
   b.animate([{transform:'translate(-50%,-50%) scale(1.12)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:320});
 };spots.append(b)});
 choices.replaceChildren();scenes[i].choices.forEach(([text,right,tip])=>{let b=document.createElement('button');b.className='option';b.innerHTML='<span class="mark"></span><span>'+text+'</span>';b.onclick=()=>{hidePop();choose(b,right,tip)};choices.append(b)});
}
function message(t){response.textContent=t;response.classList.add('on');clearTimeout(respT);respT=setTimeout(()=>response.classList.remove('on'),1450)}
function choose(btn,correct,msg){if(busy||!started||ended)return;message(msg);btn.classList.add(correct?'good':'bad');if(!correct){setTimeout(()=>btn.classList.remove('bad'),1350);return}busy=true;targetZoom=210;setTimeout(()=>{fade.classList.add('active')},570);setTimeout(()=>{if(current<scenes.length-1){setScene(current+1);targetZoom=115;setTimeout(()=>{fade.classList.remove('active');targetZoom=0},100)}else{$('end').classList.remove('hide');ended=true;fade.classList.remove('active')}},1060)}
$('begin').onclick=()=>{$('intro').classList.add('hide');started=true;setScene(0)};
$('replay').onclick=()=>{$('end').classList.add('hide');ended=false;started=true;fade.classList.add('active');setTimeout(()=>{setScene(0);fade.classList.remove('active')},350)};
$('reset').onclick=resetView;
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};
view.addEventListener('pointerdown',e=>{if(!started||busy||ended||e.target.closest('button'))return;down={id:e.pointerId,x:e.clientX,y:e.clientY,yaw:ry,pitch:rx};mode='drag';view.setPointerCapture?.(e.pointerId);view.classList.add('dragging')});
view.addEventListener('pointermove',e=>{if(!started||busy||ended)return;
 if(down?.id===e.pointerId){dragX=Math.max(-36,Math.min(36,down.yaw+(e.clientX-down.x)*.14));dragY=Math.max(-17,Math.min(17,down.pitch-(e.clientY-down.y)*.085))}
 else{hoverX=(e.clientX/window.innerWidth-.5)*19;hoverY=(.5-e.clientY/window.innerHeight)*10}});
const release=e=>{if(down?.id===e.pointerId){down=null;mode='auto';hoverX=dragX*.28;hoverY=dragY*.28}view.classList.remove('dragging')};view.addEventListener('pointerup',release);view.addEventListener('pointercancel',release);
view.addEventListener('wheel',e=>{if(!started||busy||ended)return;e.preventDefault();targetZoom=Math.max(-25,Math.min(205,targetZoom+(e.deltaY<0?22:-22)))},{passive:false});
window.addEventListener('keydown',e=>{if(!started||busy||ended)return;if(e.key==='ArrowLeft'){hoverX=Math.max(-24,hoverX-5)}else if(e.key==='ArrowRight'){hoverX=Math.min(24,hoverX+5)}else if(e.key==='ArrowUp'){targetZoom=Math.min(130,targetZoom+15)}else if(e.key==='ArrowDown'){targetZoom=Math.max(-25,targetZoom-15)}else if(e.key==='Escape')hidePop()});
document.getElementById('app').appendChild(spots);
window.__fireHotspotCheck={scene:setScene, count:()=>scenes.map(s=>s.points.length)};
setScene(0);
})();
